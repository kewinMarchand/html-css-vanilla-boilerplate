add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-cPte1893B5CZe0WZGUDtdfHwlE4dVytWUUmFscbd3V4=' $matomo_origin; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' $glitchtip_origin $matomo_origin; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
