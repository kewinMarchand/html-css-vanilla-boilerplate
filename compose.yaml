services:
  web:
    build: .
    ports:
      - '${PORT:-8080}:80'
    environment:
      MAINTENANCE: ${MAINTENANCE:-0}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-production}
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}

  node:
    profiles: [dev]
    build:
      context: docker/node
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: html-css-vanilla-boilerplate:node
    user: '${HOST_UID:-1000}:${HOST_GID:-1000}'
    init: true
    ipc: host
    network_mode: host
    environment:
      HOME: /tmp
      CI: ${CI:-}
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      GLITCHTIP_ENVIRONMENT: ${GLITCHTIP_ENVIRONMENT:-}
      MATOMO_URL: ${MATOMO_URL:-}
      MATOMO_SITE_ID: ${MATOMO_SITE_ID:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
