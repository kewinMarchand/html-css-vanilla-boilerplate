<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Une erreur est survenue · HTML CSS Vanilla Boilerplate</title>
    <meta
      name="description"
      content="Une erreur empêche d'afficher cette page. Réessayez dans quelques instants ou revenez à l'accueil."
    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      document.documentElement.dataset.js = ''
      try {
        if (localStorage.getItem('a11y-mode') === 'enhanced') {
          document.documentElement.dataset.a11yMode = 'enhanced'
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <script type="module" src="/js/shared/a11yModeToggle.js"></script>
    <script type="module" src="/js/shared/categoryMenu.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Accueil",
            "item": "https://www.example.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Une erreur est survenue",
            "item": "https://www.example.com/50x"
          }
        ]
      }
    </script>
  </head>
  <body>
    <!--# set var="page" value="autre" -->
    <!--# include virtual="/partials/header.html" -->
    <main id="main">
      <div class="container page prose">
        <nav class="breadcrumb" aria-label="Fil d'Ariane" data-testid="layout-breadcrumb">
          <ol>
            <li><a href="/">Accueil</a></li>
            <li><span aria-current="page">Une erreur est survenue</span></li>
          </ol>
        </nav>
        <h1>Une erreur est survenue</h1>
        <p>Cette page ne peut pas s'afficher pour le moment. Réessayez dans quelques instants.</p>
        <p class="error-actions">
          <a class="button button-primary" href="" data-testid="error-retry"
            ><svg class="icon" aria-hidden="true" focusable="false" width="20" height="20">
              <use href="/icons/sprite.svg#retry"></use>
            </svg>
            Réessayer</a
          >
          <a class="button button-secondary" href="/" data-testid="error-home-link"
            >Retour à l'accueil</a
          >
        </p>
      </div>
    </main>
    <!--# include virtual="/partials/footer.html" -->
  </body>
</html>
