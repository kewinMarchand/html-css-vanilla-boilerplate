<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Site en maintenance · HTML CSS Vanilla Boilerplate</title>

    />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      document.documentElement.dataset.js = ''
      try {
        if (localStorage.getItem('a11y-mode') === 'enhanced') {
          document.documentElement.dataset.a11yMode = 'enhanced'
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <script type="module" src="/js/shared/a11yModeToggle.js"></script>
    <script type="module" src="/js/shared/categoryMenu.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Accueil",
            "item": "https://www.example.com/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Site en maintenance",
            "item": "https://www.example.com/503"
          }
        ]
      }
    </script>

    <!--# set var="page" value="erreur" -->

      <div class="container page prose">
        <nav class="breadcrumb" aria-label="Fil d'Ariane" data-testid="layout-breadcrumb">
          <ol>
            <li><a href="/">Accueil</a></li>
            <li><span aria-current="page">Site en maintenance</span></li>
          </ol>
        </nav>
        <h1>Site en maintenance</h1>
        <p>
          Le site est en cours de maintenance. Il sera de nouveau disponible dans quelques minutes.
        </p>
        <p>
          Pour une demande urgente : <a href="mailto:contact@example.com">contact@example.com</a>.
