    <script type="module" src="/js/shared/categoryMenu.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Accueil",
            "item": "https://www.example.com/"
          },
          {

      }
    </script>

  <body>
    <!--# set var="page" value="taches" -->
    <!--# include virtual="/partials/header.html" -->
    <main id="main">
      <div class="container page">
        <nav class="breadcrumb" aria-label="Fil d'Ariane" data-testid="layout-breadcrumb">
          <ol>
            <li><a href="/">Accueil</a></li>
            <li><span aria-current="page">Tâches</span></li>
          </ol>
        </nav>
        <h1>Tâches</h1>
        <p>
          Données chargées en JavaScript natif depuis un dépôt en mémoire : chargement, erreur avec
          relance et liste vide sont gérés.
        </p>
        <div class="tasks" data-tasks>
          <div class="tasks-state" data-tasks-state tabindex="-1">
            <div class="skeleton-list" role="status" data-testid="tasks-loading">
              <span class="visually-hidden">Chargement des tâches…</span>
              <span class="skeleton" aria-hidden="true"></span>
              <span class="skeleton" aria-hidden="true"></span>
              <span class="skeleton" aria-hidden="true"></span>
            </div>
          </div>
          <noscript
            ><div class="bui-alert bui-alert--info">
              <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
                <use href="/icons.svg#info"></use>
              </svg>
              <div class="bui-alert__content">
                <span class="bui-visually-hidden">Information :</span>
                <div class="bui-alert__body">
                  <p>
                    Cette démo charge les tâches en JavaScript. Activez-le pour afficher la liste.
                  </p>
                </div>
              </div>
            </div></noscript
          >
        </div>
        <template id="tasks-loading-template">
          <div class="skeleton-list" role="status" data-testid="tasks-loading">
            <span class="visually-hidden">Chargement des tâches…</span>
            <span class="skeleton" aria-hidden="true"></span>
            <span class="skeleton" aria-hidden="true"></span>
            <span class="skeleton" aria-hidden="true"></span>
          </div>
        </template>
        <template id="tasks-error-template">
          <div class="bui-alert bui-alert--error" role="alert" data-testid="tasks-error">
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#circle-alert"></use>
            </svg>
            <div class="bui-alert__content">
              <span class="bui-visually-hidden">Erreur :</span>
              <div class="bui-alert__body"><p data-tasks-error-message></p></div>
            </div>
            <div class="bui-alert__action">
              <button
                type="button"
                class="bui-button bui-button--outline"
                data-tasks-retry
                data-testid="tasks-retry"
              >
                Réessayer
              </button>
            </div>
          </div>
        </template>
        <template id="tasks-empty-template">
          <div class="bui-alert bui-alert--info" data-testid="tasks-empty">
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#info"></use>
            </svg>
            <div class="bui-alert__content">
              <span class="bui-visually-hidden">Information :</span>
              <div class="bui-alert__body">
                <p>Aucune tâche pour l'instant. Tout est à jour.</p>
              </div>
            </div>
          </div>
        </template>
        <template id="tasks-list-template">
          <search class="tasks-search">
            <label for="tasks-filter">Filtrer les tâches</label>
            <input
              type="search"
              id="tasks-filter"
              name="filtre"
              autocomplete="off"
              data-tasks-filter
              data-testid="tasks-filter"
            />
            <output for="tasks-filter" data-tasks-count data-testid="tasks-count"></output>
          </search>
          <ul class="task-list" data-tasks-list data-testid="tasks-list"></ul>
          <div
            class="bui-alert bui-alert--info"
            data-tasks-no-match
            data-testid="tasks-no-match"
            hidden
          >
            <svg class="bui-icon bui-alert__icon" aria-hidden="true" focusable="false">
              <use href="/icons.svg#info"></use>
            </svg>
            <div class="bui-alert__content">
              <span class="bui-visually-hidden">Information :</span>
              <div class="bui-alert__body"><p data-tasks-no-match-message></p></div>
            </div>
          </div>
          <p class="tasks-progress">
            <label for="tasks-progress">Avancement</label>
            <progress
              id="tasks-progress"
              data-tasks-progress
              data-testid="tasks-progress"
            ></progress>
            <span data-tasks-progress-text></span>
          </p>
        </template>
        <template id="tasks-item-template">
          <li class="task-item" data-testid="tasks-item">
            <span class="task-icon" aria-hidden="true"></span>
            <span class="task-title" data-task-title></span>
            <span class="task-status" data-task-status></span>
          </li>
        </template>
      </div>
    </main>
    <!--# include virtual="/partials/footer.html" -->
  </body>
</html>
